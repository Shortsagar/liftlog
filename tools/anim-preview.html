<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation preview</title>
<link rel="stylesheet" href="../src/css/app.css">
<style>
  body { padding: 16px; }
  .row { display: grid; grid-template-columns: 140px repeat(4, 1fr); gap: 6px; align-items: center; margin-bottom: 6px; }
  .row .figure { background: var(--surface); border-radius: 8px; }
  h1 { margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Animation preview (dev)</h1>
<p class="muted small">Each exercise at t = 0, 0.25, 0.5, 0.75. Edit keyframes in database/exercises.js and reload. Add <code>?ex=squat</code> to show one.</p>
<div id="out"></div>
<script type="module">
  import { EXERCISES } from '../database/exercises.js';
  import { createFigure } from '../src/figure.js';
  const only = new URLSearchParams(location.search).get('ex');
  const out = document.getElementById('out');
  for (const ex of EXERCISES.filter(e => !only || only.split(',').includes(e.id))) {
    const row = document.createElement('div'); row.className = 'row';
    const label = document.createElement('div'); label.textContent = ex.name; label.className = 'small';
    row.append(label);
    for (const t of [0, 0.25, 0.5, 0.75]) row.append(createFigure(ex, { autoplay: false, phase: t }).el);
    out.append(row);
  }
</script>
</body>
</html>
